// Load local properties if they exist
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Set project properties from local.properties with fallbacks
ext {
    BASE_URL = localProperties.getProperty('BASE_URL', project.findProperty('BASE_URL') ?: '"http://192.168.0.90/"')
    userName = localProperties.getProperty('USER_NAME', project.findProperty('userName') ?: '"lmp_video"')
    userPassword = localProperties.getProperty('USER_PASSWORD', project.findProperty('userPassword') ?: '"6278374886"')
    KEYSTORE_PATH = localProperties.getProperty('KEYSTORE_PATH', 'mydining.jks')
    KEYSTORE_PASSWORD = localProperties.getProperty('KEYSTORE_PASSWORD', '1M@ruf21')
    KEY_ALIAS = localProperties.getProperty('KEY_ALIAS', 'maruf')
    KEY_PASSWORD = localProperties.getProperty('KEY_PASSWORD', '1M@ruf21')
}

buildscript {
    ext.kotlin_version = '2.1.0' // Define this first

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.56.1"

    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            // Force Kotlin everywhere
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlin_version"

            // Remove jdk7/jdk8 variants as they're included in stdlib since 1.8
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

            // Additional safety for transitive dependencies
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion kotlin_version
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}